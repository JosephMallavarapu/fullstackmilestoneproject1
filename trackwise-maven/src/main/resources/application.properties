# ═══════════════════════════════════════════════════
#  TrackWise — application.properties
#  Spring Boot 3.2.x | MySQL 8 | Eclipse Maven
# ═══════════════════════════════════════════════════

server.port=8080
spring.application.name=trackwise

# ── DataSource ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/trackwise?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# TODO: replace with your MySQL password
spring.datasource.password=9347314086
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA / Hibernate ─────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ── JWT ─────────────────────────────────────────────
trackwise.jwt.secret=TrackWise_JWT_Secret_Key_Industry_v2_2025_Very_Long_String
trackwise.jwt.expiration-ms=86400000
trackwise.jwt.refresh-expiration-ms=604800000

# ── Swagger / OpenAPI ────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Mail (SendGrid SMTP) ─────────────────────────────
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
# TODO: replace with your SendGrid API key
spring.mail.password=SG.your_sendgrid_api_key_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
trackwise.mail.from=noreply@trackwise.io

# ── Currency FX (ExchangeRates API) ─────────────────
trackwise.currency.api-url=https://api.exchangeratesapi.io/v1/latest
# TODO: replace with your ExchangeRates API key
trackwise.currency.api-key=your_exchangerates_api_key_here
trackwise.currency.base=USD
trackwise.currency.refresh-cron=0 0 * * * ?

# ── OCR ─────────────────────────────────────────────
trackwise.ocr.provider=TESSERACT
trackwise.ocr.upload-dir=./uploads/receipts

# ── ERP (QuickBooks OAuth2) ─────────────────────────
trackwise.erp.quickbooks.auth-url=https://appcenter.intuit.com/connect/oauth2
trackwise.erp.quickbooks.token-url=https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer
trackwise.erp.quickbooks.api-url=https://sandbox-quickbooks.api.intuit.com/v3
trackwise.erp.sync-cron=0 0/30 * * * ?

# ── Security (rate limiting) ─────────────────────────
trackwise.security.max-login-attempts=5
trackwise.security.lockout-minutes=30

# ── Logging ──────────────────────────────────────────
logging.level.com.trackwise=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
