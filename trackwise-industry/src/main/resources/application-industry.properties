# ═══════════════════════════════════════════════════════════════
#  TrackWise — Industry Feature Configuration
#  Add these to your main application.properties
# ═══════════════════════════════════════════════════════════════

# ── Policy Engine ───────────────────────────────────────────────
app.policy.single-transaction-limit=1000
app.policy.auto-reject-threshold=10000
app.policy.daily-cap-per-user=2000
app.policy.receipt-required-above=50
app.policy.weekend-flagging=true
app.policy.duplicate-detection-days=7

# ── Multi-Currency / FX ─────────────────────────────────────────
# Get API key from: https://exchangeratesapi.io
app.fx.api-key=your_exchangeratesapi_key_here
app.fx.base-url=https://api.exchangeratesapi.io/v1
app.fx.refresh-interval-hours=6

# ── OCR Receipt Scanning ────────────────────────────────────────
# provider: aws-textract | google-vision | tesseract
app.ocr.provider=aws-textract
app.ocr.max-file-size-mb=10
app.ocr.confidence-threshold=0.75

# AWS Textract credentials
aws.access-key-id=your_aws_access_key
aws.secret-access-key=your_aws_secret_key
aws.region=us-east-1

# ── Notifications ───────────────────────────────────────────────
app.notification.from-email=noreply@trackwise.io
app.notification.from-name=TrackWise

# SendGrid SMTP (for emails)
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=your_sendgrid_api_key
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio (for SMS)
twilio.account-sid=your_twilio_account_sid
twilio.auth-token=your_twilio_auth_token
twilio.from-number=+1234567890

# ── ERP Integrations ────────────────────────────────────────────
# Active ERP: QUICKBOOKS | SAP_CONCUR | XERO | ORACLE_NETSUITE
app.erp.active=QUICKBOOKS
app.erp.retry-attempts=3
app.erp.sync-interval-minutes=30

# QuickBooks Online
# Get credentials from: https://developer.intuit.com
quickbooks.client-id=your_qbo_client_id
quickbooks.client-secret=your_qbo_client_secret
quickbooks.realm-id=your_company_realm_id
quickbooks.redirect-uri=http://localhost:8080/api/v1/erp/quickbooks/callback
# Use sandbox for testing:
quickbooks.base-url=https://sandbox-quickbooks.api.intuit.com
# Production:
# quickbooks.base-url=https://quickbooks.api.intuit.com

# SAP Concur
sap.concur.client-id=your_concur_client_id
sap.concur.client-secret=your_concur_client_secret
sap.concur.base-url=https://us.api.concursolutions.com

# ── Security (ISO 27001 + PCI DSS) ─────────────────────────────
app.security.max-requests-per-minute=60
app.security.login-max-attempts=5
app.security.lockout-duration-minutes=30

# Spring Cache (for FX rate caching)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=6h

# Async thread pool (for notifications, ERP sync)
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.pool.size=2
